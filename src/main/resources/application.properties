spring.application.name=hackaton-soat11-videosvc
server.port=3000

spring.datasource.url=${DB_HOST:jdbc:postgresql://localhost:5432/hackaton_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.servlet.multipart.max-file-size=500MB

spring.servlet.multipart.max-request-size=500MB

aws.sqs.endpoint=${CLIPTOZIP_EVENTS_URL}
aws.s3.bucket-name=${S3_BUCKET_NAME}
aws.region=${AWS_REGION}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}

external.api.url=${AUTH_API_URL:http://localhost:3000/auth/validate-token}
